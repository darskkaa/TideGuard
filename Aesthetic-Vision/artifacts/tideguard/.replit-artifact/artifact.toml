kind = "web"
previewPath = "/"
title = "TideGuard"
version = "1.0.0"
id = "artifacts/tideguard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23162

[services.development]
run = "pnpm --filter @workspace/tideguard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tideguard", "run", "build" ]
publicDir = "artifacts/tideguard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23162"
BASE_PATH = "/"
